repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: Ruff format check
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: python-tests
        name: Python tests
        entry: python -m pytest
        language: system
        pass_filenames: false
      - id: markdown-basic
        name: Basic Markdown check
        entry: python src/localization_learning/markdown_check.py .
        language: system
        pass_filenames: false
        types: [markdown]
