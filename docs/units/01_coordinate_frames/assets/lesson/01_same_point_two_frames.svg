<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">图 1｜同一个点，两套读数</title><desc id="desc">点 P 没有移动；改变的是测量原点和坐标轴。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E293B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter><pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/></pattern></defs><rect width="1200" height="700" fill="#F8FAFC"/><text x="60" y="50" font-size="32" font-weight="700" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">图 1｜同一个点，两套读数</text><text x="60" y="82" font-size="22" fill="#475569" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">点 P 没有移动；改变的是测量原点和坐标轴。</text><rect x="55" y="110" width="1090" height="500" rx="24" fill="#FFFFFF" opacity="1.0" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/><rect x="80" y="135" width="1040" height="430" fill="url(#smallGrid)" rx="16"/><line x1="170" y1="530" x2="290.0" y2="530.0" stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)" opacity="1.0"/><line x1="170" y1="530" x2="170.0" y2="410.0" stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)" opacity="1.0"/><circle cx="170" cy="530" r="7" fill="#1E293B"/><text x="298.0" y="534.0" font-size="18" font-weight="700" text-anchor="start" fill="#2563EB" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">x_A</text><text x="178.0" y="406.0" font-size="18" font-weight="700" text-anchor="start" fill="#2563EB" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">y_A</text><text x="166" y="557" font-size="18" font-weight="700" text-anchor="middle" fill="#1E293B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">O_A</text><line x1="500" y1="430" x2="620.0" y2="430.0" stroke="#F97316" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)" opacity="1.0"/><line x1="500" y1="430" x2="500.0" y2="310.0" stroke="#F97316" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)" opacity="1.0"/><circle cx="500" cy="430" r="7" fill="#1E293B"/><text x="628.0" y="434.0" font-size="18" font-weight="700" text-anchor="start" fill="#F97316" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">x_B</text><text x="508.0" y="306.0" font-size="18" font-weight="700" text-anchor="start" fill="#F97316" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">y_B</text><text x="496" y="457" font-size="18" font-weight="700" text-anchor="middle" fill="#1E293B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">O_B</text><circle cx="860" cy="190" r="14" fill="#DB2777"/><text x="882" y="197" font-size="24" font-weight="700" text-anchor="start" fill="#DB2777" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">同一个物理点 P</text><line x1="170" y1="530" x2="860" y2="190" stroke="#2563EB" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)" stroke-dasharray="12 10" opacity="0.9"/><line x1="500" y1="430" x2="860" y2="190" stroke="#F97316" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)" stroke-dasharray="12 10" opacity="0.9"/><rect x="255" y="270" width="230" height="54" rx="27.0" fill="#2563EB" opacity="1.0"/><text x="370.0" y="306.72" font-size="20" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">A 的读数：p_A</text><rect x="595" y="320" width="230" height="54" rx="27.0" fill="#F97316" opacity="1.0"/><text x="710.0" y="356.72" font-size="20" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">B 的读数：p_B</text><text x="600" y="650" font-size="25" font-weight="700" text-anchor="middle" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">结论：坐标是“用哪把尺子量出来的数字”，不是物理点本身。</text></svg>
