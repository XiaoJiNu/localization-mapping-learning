<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">图 5｜齐次坐标的末位，是“平移开关”</title><desc id="desc">w=1 打开平移；w=0 关闭平移。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E293B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter><pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/></pattern></defs><rect width="1200" height="700" fill="#F8FAFC"/><text x="60" y="50" font-size="32" font-weight="700" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">图 5｜齐次坐标的末位，是“平移开关”</text><text x="60" y="82" font-size="22" fill="#475569" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">w=1 打开平移；w=0 关闭平移。</text><rect x="55" y="120" width="1090" height="490" rx="24" fill="#FFFFFF" opacity="1.0" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/><rect x="420" y="180" width="360" height="245" rx="12" fill="#F8FAFC" opacity="1.0" stroke="#1E293B" stroke-width="3"/><rect x="440" y="205" width="185" height="130" rx="8" fill="#EFF6FF" opacity="1.0" stroke="#2563EB" stroke-width="2"/><rect x="640" y="205" width="110" height="130" rx="8" fill="#ECFDF5" opacity="1.0" stroke="#16A34A" stroke-width="2"/><text x="532" y="275" font-size="54" font-weight="700" text-anchor="middle" fill="#2563EB" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">R</text><text x="695" y="275" font-size="54" font-weight="700" text-anchor="middle" fill="#16A34A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">t</text><text x="532" y="375" font-size="34" font-weight="600" text-anchor="middle" fill="#475569" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">0ᵀ</text><text x="695" y="375" font-size="34" font-weight="600" text-anchor="middle" fill="#475569" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">1</text><text x="600" y="160" font-size="26" font-weight="700" text-anchor="middle" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">齐次变换 T</text><rect x="90" y="155" width="245" height="120" rx="18" fill="#FDF2F8" opacity="1.0" stroke="#DB2777" stroke-width="2"/><text x="212" y="195" font-size="24" font-weight="700" text-anchor="middle" fill="#DB2777" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">点</text><text x="212" y="238" font-size="32" font-weight="700" text-anchor="middle" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">[ p ; 1 ]</text><line x1="335" y1="215" x2="420" y2="245" stroke="#DB2777" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-red)" opacity="1.0"/><rect x="810" y="165" width="255" height="54" rx="27.0" fill="#DB2777" opacity="1.0"/><text x="937.5" y="201.72" font-size="20" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">w = 1：平移 ON</text><text x="938" y="255" font-size="28" font-weight="700" text-anchor="middle" fill="#DB2777" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">输出：R·p + t</text><rect x="90" y="405" width="245" height="120" rx="18" fill="#F5F3FF" opacity="1.0" stroke="#7C3AED" stroke-width="2"/><text x="212" y="445" font-size="24" font-weight="700" text-anchor="middle" fill="#7C3AED" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">方向向量</text><text x="212" y="488" font-size="32" font-weight="700" text-anchor="middle" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">[ v ; 0 ]</text><line x1="335" y1="465" x2="420" y2="385" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-purple)" opacity="1.0"/><rect x="810" y="415" width="255" height="54" rx="27.0" fill="#7C3AED" opacity="1.0"/><text x="937.5" y="451.72" font-size="20" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">w = 0：平移 OFF</text><text x="938" y="505" font-size="28" font-weight="700" text-anchor="middle" fill="#7C3AED" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">输出：R·v</text><line x1="750" y1="270" x2="810" y2="220" stroke="#DB2777" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-red)" opacity="1.0"/><line x1="750" y1="360" x2="810" y2="470" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-purple)" opacity="1.0"/><text x="600" y="575" font-size="25" font-weight="700" text-anchor="middle" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">同一矩阵，末