<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">图 9｜定位系统的四层坐标系</title><desc id="desc">sensor 看世界，base 代表车，odom 保连续，map 管全局。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E293B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter><pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/></pattern></defs><rect width="1200" height="700" fill="#F8FAFC"/><text x="60" y="50" font-size="32" font-weight="700" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">图 9｜定位系统的四层坐标系</text><text x="60" y="82" font-size="22" fill="#475569" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">sensor 看世界，base 代表车，odom 保连续，map 管全局。</text><rect x="55" y="120" width="1090" height="490" rx="24" fill="#FFFFFF" opacity="1.0" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/><rect x="90" y="155" width="1020" height="400" rx="26" fill="#EFF6FF" opacity="1.0" stroke="#2563EB" stroke-width="3"/><text x="130" y="195" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">map：全局地图，可接受回环 / GNSS / 重定位修正</text><rect x="220" y="225" width="760" height="255" rx="24" fill="#ECFDF5" opacity="1.0" stroke="#16A34A" stroke-width="3"/><text x="260" y="265" font-size="23" font-weight="700" text-anchor="start" fill="#16A34A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">odom：局部连续，但长期会漂移</text><rect x="485" y="340" width="230" height="95" rx="18" fill="#FFFFFF" opacity="1.0" stroke="#1E293B" stroke-width="3" filter="url(#shadow)"/><circle cx="535" cy="445" r="25" fill="#1E293B"/><circle cx="665" cy="445" r="25" fill="#1E293B"/><text x="600" y="395" font-size="28" font-weight="700" text-anchor="middle" fill="#1E293B" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">base：车体</text><rect x="570" y="290" width="60" height="45" rx="10" fill="#FFF7ED" opacity="1.0" stroke="#F97316" stroke-width="2"/><text x="600" y="320" font-size="17" font-weight="700" text-anchor="middle" fill="#F97316" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">lidar</text><line x1="600" y1="290" x2="600" y2="245" stroke="#F97316" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)" opacity="1.0"/><text x="600" y="520" font-size="24" font-weight="700" text-anchor="middle" fill="#7C3AED" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">点坐标计算：lidar → base → odom → map</text><text x="600" y="590" font-size="22" font-weight="600" text-anchor="middle" fill="#475569" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">TF 父子拓扑：map → odom → base → lidar</text><rect x="105" y="565" width="280" height="48" rx="24.0" fill="#2563EB" opacity="1.0"/><text x="245.0" y="597.64" font-size="18" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">全局修正放在 map↔odom</text><rect x="815" y="565" width="280" height="48" rx="24.0" fill="#16A34A" opacity="1.0"/><text x="955.0" y="597.64" font-size="18" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">局部控制保持 odom↔base 连续</text></svg>
