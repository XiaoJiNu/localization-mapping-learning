<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">图 10｜动态变换必须对齐测量时刻</title><desc id="desc">方向和顺序都正确，时间用错仍会产生偏移。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E293B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter><pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/></pattern></defs><rect width="1200" height="700" fill="#F8FAFC"/><text x="60" y="50" font-size="32" font-weight="700" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">图 10｜动态变换必须对齐测量时刻</text><text x="60" y="82" font-size="22" fill="#475569" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">方向和顺序都正确，时间用错仍会产生偏移。</text><rect x="55" y="120" width="1090" height="490" rx="24" fill="#FFFFFF" opacity="1.0" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/><line x1="140" y1="420" x2="1060" y2="420" stroke="#1E293B" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-dark)" opacity="1.0"/><circle cx="300" cy="420" r="12" fill="#16A34A"/><circle cx="830" cy="420" r="12" fill="#DC2626"/><text x="300" y="460" font-size="23" font-weight="700" text-anchor="middle" fill="#16A34A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">t₀ = 12.0 s</text><text x="830" y="460" font-size="23" font-weight="700" text-anchor="middle" fill="#DC2626" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">t₁ = 12.1 s</text><rect x="175" y="250" width="250" height="58" rx="29.0" fill="#16A34A" opacity="1.0"/><text x="300.0" y="289.44" font-size="22" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">激光帧产生</text><rect x="700" y="250" width="260" height="58" rx="29.0" fill="#DC2626" opacity="1.0"/><text x="830.0" y="289.44" font-size="22" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">程序开始处理</text><rect x="235" y="330" width="130" height="55" rx="12" fill="#ECFDF5" opacity="1.0" stroke="#16A34A" stroke-width="2"/><text x="300" y="365" font-size="20" font-weight="700" text-anchor="middle" fill="#16A34A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">车在位置 x₀</text><rect x="765" y="330" width="130" height="55" rx="12" fill="#FEF2F2" opacity="1.0" stroke="#DC2626" stroke-width="2"/><text x="830" y="365" font-size="20" font-weight="700" text-anchor="middle" fill="#DC2626" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">车在位置 x₁</text><line x1="365" y1="357" x2="765" y2="357" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-red)" stroke-dasharray="10 8" opacity="1.0"/><text x="565" y="342" font-size="20" font-weight="700" text-anchor="middle" fill="#DC2626" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">车辆在延迟期间继续运动</text><rect x="170" y="520" width="860" height="85" rx="16" fill="#FFF7ED" opacity="1.0" stroke="#F97316" stroke-width="2"/><text x="600" y="555" font-size="25" font-weight="700" text-anchor="middle" fill="#0F172A" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">正确：查询 T(t₀)　　错误：直接使用最新 T(t₁)</text><text x="600" y="588" font-size="22" font-weight="700" text-anchor="middle" fill="#DC2626" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">平移误差直觉：Δx ≈ v·Δt；10 m/s × 0.1 s = 1 m</text></svg>
