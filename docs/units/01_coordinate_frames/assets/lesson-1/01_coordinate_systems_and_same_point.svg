<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="同一个点在不同坐标系中的表达">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#F97316"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16A34A"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#DC2626"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="560" rx="0" fill="#F7F9FC"/>
<text x="40" y="48" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#172033" text-anchor="start">同一个世界，不同的尺子</text>
<text x="40" y="82" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#5B6780" text-anchor="start">Infographic Engine：用短标签、颜色分组和箭头先建立坐标直觉</text>
<line x1="40" y1="100" x2="1560" y2="100" stroke="#D8E1EF" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="35" y="125" width="720" height="390" rx="18" fill="#FFFFFF" stroke="#D8E1EF" stroke-width="1" filter="url(#shadow)"/>
<circle cx="75" cy="161" r="22" fill="#2563EB"/>
<text x="75" y="169" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="109" y="170" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="750" fill="#172033" text-anchor="start">为什么定位建图离不开坐标系</text>
<rect x="85" y="267.5" width="150" height="55" rx="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
<rect x="115" y="245" width="75" height="40" rx="12.5" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
<circle cx="117.5" cy="326.25" r="16.25" fill="#172033"/>
<circle cx="205" cy="326.25" r="16.25" fill="#172033"/>
<rect x="260" y="210" width="70" height="55" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
<rect x="270" y="192" width="50" height="24" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
<line x1="295" y1="215" x2="362.97" y2="246.70" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.55"/>
<line x1="295" y1="215" x2="368.86" y2="228.02" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.55"/>
<line x1="295" y1="215" x2="368.86" y2="201.98" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.55"/>
<line x1="295" y1="215" x2="362.97" y2="183.30" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.55"/>
<rect x="570" y="225" width="90" height="75" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
<line x1="600" y1="225" x2="600" y2="300" stroke="#16A34A" stroke-width="1"/>
<line x1="630" y1="225" x2="630" y2="300" stroke="#16A34A" stroke-width="1"/>
<line x1="570" y1="250" x2="660" y2="250" stroke="#16A34A" stroke-width="1"/>
<line x1="570" y1="275" x2="660" y2="275" stroke="#16A34A" stroke-width="1"/>
<circle cx="615" cy="259" r="8" fill="#DC2626"/>
<text x="145" y="380" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="middle">base</text>
<text x="295" y="295" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" fill="#7C3AED" text-anchor="middle">lidar</text>
<text x="615" y="320" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" fill="#16A34A" text-anchor="middle">map</text>
<path d="M210 310 C320 420, 450 365, 590 300" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)" stroke-dasharray="9 8"/>
<text x="385" y="434" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="600" fill="#5B6780" text-anchor="middle">同一个环境，被不同模块用不同坐标系描述</text>
<rect x="785" y="125" width="780" height="390" rx="18" fill="#FFFFFF" stroke="#D8E1EF" stroke-width="1" filter="url(#shadow)"/>
<circle cx="825" cy="161" r="22" fill="#F97316"/>
<text x="825" y="169" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="859" y="170" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="750" fill="#172033">同一个点 P 的两组读数</text>
<line x1="900" y1="385" x2="1032.25" y2="385" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow-blue)"/>
<line x1="900" y1="385" x2="900" y2="264.25" stroke="#16A34A" stroke-width="4" marker-end="url(#arrow-green)"/>
<circle cx="900" cy="385" r="7" fill="#172033"/>
<text x="1038" y="393" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#2563EB">x_A</text>
<text x="890" y="256" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">y_A</text>
<text x="884" y="411" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="end">O_A</text>
<line x1="1280" y1="385" x2="1412.25" y2="385" stroke="#F97316" stroke-width="4" marker-end="url(#arrow-orange)"/>
<line x1="1280" y1="385" x2="1280" y2="264.25" stroke="#16A34A" stroke-width="4" marker-end="url(#arrow-green)"/>
<circle cx="1280" cy="385" r="7" fill="#172033"/>
<text x="1418" y="393" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#F97316">x_B</text>
<text x="1270" y="256" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">y_B</text>
<text x="1264" y="411" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="end">O_B</text>
<circle cx="1110" cy="205" r="12" fill="#7C3AED"/>
<text x="1130" y="199" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="750" fill="#7C3AED">P（物理点不动）</text>
<line x1="900" y1="385" x2="1110" y2="205" stroke="#2563EB" stroke-width="3" stroke-dasharray="7 7"/>
<line x1="1280" y1="385" x2="1110" y2="205" stroke="#F97316" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="845" y="440" width="290" height="54" rx="12" fill="#DBEAFE" stroke="#2563EB"/>
<text x="990" y="476" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="750" fill="#172033" text-anchor="middle">p_A = [5, 3]</text>
<rect x="1210" y="440" width="290" height="54" rx="12" fill="#FFEDD5" stroke="#F97316"/>
<text x="1355" y="476" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="750" fill="#172033" text-anchor="middle">p_B = [2, 2]</text>
<text x="1175" y="505" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="800" fill="#172033" text-anchor="middle">变化的是读数，不是点。</text>
</svg>
