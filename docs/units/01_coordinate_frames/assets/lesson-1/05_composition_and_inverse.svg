<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="组合与逆变换">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/></filter><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F97316"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16A34A"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#DC2626"/></marker></defs>
<rect width="1600" height="520" fill="#F7F9FC"/><text x="40" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="800" fill="#172033">多个变换像接力传球；逆变换要重新表达平移</text><text x="40" y="82" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#5B6780">矩阵能相乘不代表语义正确，先检查每一棒的输入和输出</text><line x1="40" y1="100" x2="1560" y2="100" stroke="#D8E1EF" stroke-width="2"/>
<rect x="35" y="125" width="735" height="340" rx="18" fill="#fff" stroke="#D8E1EF" filter="url(#shadow)"/><circle cx="75" cy="161" r="22" fill="#2563EB"/><text x="75" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">9</text><text x="109" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">组合：C → B → A</text>
<circle cx="140" cy="280" r="50" fill="#7C3AED"/><text x="140" y="291" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="850" fill="#fff" text-anchor="middle">C</text><circle cx="400" cy="280" r="50" fill="#F97316"/><text x="400" y="291" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="850" fill="#fff" text-anchor="middle">B</text><circle cx="660" cy="280" r="50" fill="#2563EB"/><text x="660" y="291" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="850" fill="#fff" text-anchor="middle">A</text><line x1="195" y1="280" x2="345" y2="280" stroke="#F97316" stroke-width="6" marker-end="url(#arrow-orange)"/><line x1="455" y1="280" x2="605" y2="280" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow-blue)"/><text x="270" y="250" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="800" fill="#F97316" text-anchor="middle">T_BC</text><text x="530" y="250" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="800" fill="#2563EB" text-anchor="middle">T_AB</text><rect x="175" y="370" width="455" height="54" rx="12" fill="#DBEAFE" stroke="#2563EB"/><text x="402" y="406" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#172033" text-anchor="middle">T_AC = T_AB · T_BC</text><text x="402" y="445" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#5B6780" text-anchor="middle">最靠近点的矩阵先作用</text>
<rect x="800" y="125" width="765" height="340" rx="18" fill="#fff" stroke="#D8E1EF" filter="url(#shadow)"/><circle cx="840" cy="161" r="22" fill="#DC2626"/><text x="840" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">10</text><text x="874" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">逆变换：A → B</text>
<line x1="900" y1="390" x2="998" y2="390" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="900" y1="390" x2="900" y2="301" stroke="#16A34A" stroke-width="4" marker-end="url(#arrow-green)"/><circle cx="900" cy="390" r="7" fill="#172033"/><text x="1002" y="398" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#2563EB">x_A</text><text x="890" y="295" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">y_A</text><text x="884" y="416" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="end">O_A</text>
<line x1="1160" y1="300" x2="1258" y2="300" stroke="#F97316" stroke-width="4" marker-end="url(#arrow-orange)"/><line x1="1160" y1="300" x2="1160" y2="211" stroke="#16A34A" stroke-width="4" marker-end="url(#arrow-green)"/><circle cx="1160" cy="300" r="7" fill="#172033"/><text x="1262" y="308" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#F97316">x_B</text><text x="1150" y="205" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">y_B</text><text x="1144" y="326" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="end">O_B</text><line x1="900" y1="390" x2="1160" y2="300" stroke="#16A34A" stroke-width="6" marker-end="url(#arrow-green)"/><line x1="1160" y1="300" x2="900" y2="390" stroke="#DC2626" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/><text x="1030" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#16A34A" text-anchor="middle">正向 t_AB</text><text x="1030" y="420" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#DC2626" text-anchor="middle">反向需要 -R^T t</text>
<rect x="1240" y="205" width="275" height="210" rx="14" fill="#FEE2E2"/><text x="1377" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="750" fill="#172033" text-anchor="middle"><tspan x="1377">T^-1 =</tspan><tspan x="1377" dy="31">[ R^T  -R^T t ]</tspan><tspan x="1377" dy="31">[  0       1  ]</tspan><tspan x="1377" dy="62">不是简单 -t</tspan></text>
</svg>
