<text x="108" y="225" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="850" fill="#fff" text-anchor="middle">A</text>
<text x="152" y="220" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="800" fill="#172033" text-anchor="start">建立二维直觉</text>
<text x="90" y="275" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="650" fill="#5B6780" text-anchor="start">同一点为何有不同坐标</text>
