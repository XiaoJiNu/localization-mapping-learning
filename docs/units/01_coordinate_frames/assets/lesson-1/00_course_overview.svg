<text x="878" y="225" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="850" fill="#fff" text-anchor="middle">C</text>
<text x="922" y="220" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="800" fill="#172033" text-anchor="start">接入定位系统</text>
<text x="860" y="275" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="650" fill="#5B6780" text-anchor="start">sensor / base / odom / map</text>
