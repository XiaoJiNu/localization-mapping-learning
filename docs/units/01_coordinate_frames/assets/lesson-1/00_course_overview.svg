<text x="1263" y="225" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="850" fill="#fff" text-anchor="middle">D</text>
<text x="1307" y="220" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="800" fill="#172033" text-anchor="start">工程判断与检查</text>
<text x="1245" y="275" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="650" fill="#5B6780" text-anchor="start">主动/被动、时间、调试</text>
<rect x="1245" y="325" width="265" height="58" rx="14" fill="#FFFFFF"/>
<text x="1377" y="362" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="800" fill="#16A34A" text-anchor="middle">章节 15～16</text>
<text x="800" y="480" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="800" fill="#172033" text-anchor="middle">学习顺序：直觉 → 公式 → 系统 → 调试</text>
