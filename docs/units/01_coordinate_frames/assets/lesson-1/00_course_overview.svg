<rect x="0" y="0" width="1600" height="520" rx="0" fill="#F7F9FC"/>
<text x="40" y="48" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#172033" text-anchor="start">单元 01：从坐标表达走到完整变换链</text>
<text x="40" y="82" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#5B6780" text-anchor="start">四个知识块：先建立直觉，再掌握矩阵工具，最后接入定位系统并形成工程检查能力</text>
