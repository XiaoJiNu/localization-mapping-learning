<text x="992" y="362" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="800" fill="#F97316" text-anchor="middle">章节 12～14</text>
<line x1="1160" y1="295" x2="1203" y2="295" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gray)" opacity="1"/>
<rect x="1215" y="165" width="325" height="260" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
