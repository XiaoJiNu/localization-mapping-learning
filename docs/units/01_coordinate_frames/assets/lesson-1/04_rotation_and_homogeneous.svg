<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="旋转矩阵与齐次坐标">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/></filter><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F97316"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16A34A"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/></marker></defs>
<rect width="1600" height="560" fill="#F7F9FC"/><text x="40" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="800" fill="#172033">旋转矩阵是坐标轴；齐次末位是平移开关</text><text x="40" y="82" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#5B6780">把矩阵看成几根箭头，把 w 看成是否允许平移进入计算</text><line x1="40" y1="100" x2="1560" y2="100" stroke="#D8E1EF" stroke-width="2"/>
<rect x="35" y="125" width="735" height="390" rx="18" fill="#fff" stroke="#D8E1EF" filter="url(#shadow)"/><circle cx="75" cy="161" r="22" fill="#2563EB"/><text x="75" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="109" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">旋转矩阵的两列</text>
<line x1="170" y1="430" x2="302" y2="430" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="170" y1="430" x2="170" y2="309" stroke="#16A34A" stroke-width="4" marker-end="url(#arrow-green)"/><circle cx="170" cy="430" r="7" fill="#172033"/><text x="308" y="438" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#2563EB">x_A</text><text x="160" y="301" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">y_A</text><text x="154" y="456" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="end">O_A</text>
<line x1="170" y1="430" x2="301" y2="338" stroke="#F97316" stroke-width="6" marker-end="url(#arrow-orange)"/><line x1="170" y1="430" x2="256" y2="307" stroke="#7C3AED" stroke-width="6" marker-end="url(#arrow-purple)"/><text x="311" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#F97316">x_B = 第 1 列</text><text x="266" y="301" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#7C3AED">y_B = 第 2 列</text>
<rect x="430" y="200" width="285" height="220" rx="14" fill="#DBEAFE"/><text x="572" y="240" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#172033" text-anchor="middle"><tspan x="572">R_AB = [ x_B  y_B ]</tspan><tspan x="572" dy="70">R^T R = I</tspan><tspan x="572" dy="35">det(R) = 1</tspan><tspan x="572" dy="35">R^-1 = R^T</tspan></text>
<rect x="800" y="125" width="765" height="390" rx="18" fill="#fff" stroke="#D8E1EF" filter="url(#shadow)"/><circle cx="840" cy="161" r="22" fill="#7C3AED"/><text x="840" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="874" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">齐次坐标：w 控制平移</text>
<rect x="835" y="205" width="325" height="240" rx="16" fill="#DBEAFE"/><text x="997" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="800" fill="#2563EB" text-anchor="middle">点</text><text x="997" y="295" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="850" fill="#172033" text-anchor="middle">w = 1</text><rect x="885" y="330" width="225" height="54" rx="27" fill="#EEF2F7"/><circle cx="1071" cy="357" r="22" fill="#16A34A"/><text x="1071" y="365" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">ON</text><text x="997" y="420" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172033" text-anchor="middle">R·p + t</text>
<rect x="1190" y="205" width="325" height="240" rx="16" fill="#EDE9FE"/><text x="1352" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="800" fill="#7C3AED" text-anchor="middle">方向向量</text><text x="1352" y="295" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="850" fill="#172033" text-anchor="middle">w = 0</text><rect x="1240" y="330" width="225" height="54" rx="27" fill="#EEF2F7"/><circle cx="1279" cy="357" r="22" fill="#64748B"/><text x="1279" y="365" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">OFF</text><text x="1352" y="420" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172033" text-anchor="middle">R·v</text><text x="1180" y="495" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="800" fill="#172033" text-anchor="middle">同一个 T，自动区分点和方向。</text>
</svg>
