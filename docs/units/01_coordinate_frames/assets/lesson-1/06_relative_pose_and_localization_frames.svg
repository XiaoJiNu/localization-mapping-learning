<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-label="相对位姿与定位坐标系">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/></filter><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F97316"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16A34A"/></marker></defs>
<rect width="1600" height="540" fill="#F7F9FC"/><text x="40" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="800" fill="#172033">先画坐标路径，再写相对位姿；再把它接进定位系统</text><text x="40" y="82" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#5B6780">共同世界坐标系提供桥梁，sensor/base/odom/map 各自承担不同职责</text><line x1="40" y1="100" x2="1560" y2="100" stroke="#D8E1EF" stroke-width="2"/>
<rect x="35" y="125" width="735" height="360" rx="18" fill="#fff" stroke="#D8E1EF" filter="url(#shadow)"/><circle cx="75" cy="161" r="22" fill="#7C3AED"/><text x="75" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">11</text><text x="109" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">由两个全局位姿求相对位姿</text><circle cx="400" cy="210" r="46" fill="#64748B"/><text x="400" y="220" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="850" fill="#fff" text-anchor="middle">W</text><circle cx="175" cy="390" r="46" fill="#2563EB"/><text x="175" y="400" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="850" fill="#fff" text-anchor="middle">A</text><circle cx="625" cy="390" r="46" fill="#F97316"/><text x="625" y="400" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="850" fill="#fff" text-anchor="middle">B</text><line x1="220" y1="370" x2="365" y2="235" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="580" y1="370" x2="435" y2="235" stroke="#F97316" stroke-width="5" marker-end="url(#arrow-orange)"/><text x="275" y="282" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#2563EB" text-anchor="middle">T_WA</text><text x="525" y="282" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#F97316" text-anchor="middle">T_WB</text><rect x="145" y="445" width="510" height="54" rx="12" fill="#EDE9FE" stroke="#7C3AED"/><text x="400" y="481" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#172033" text-anchor="middle">T_AB = (T_WA)^-1 · T_WB</text>
<rect x="800" y="125" width="765" height="360" rx="18" fill="#fff" stroke="#D8E1EF" filter="url(#shadow)"/><circle cx="840" cy="161" r="22" fill="#16A34A"/><text x="840" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">12</text><text x="874" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">定位系统的四层坐标系</text>
<rect x="800" y="225" width="140" height="145" rx="18" fill="#fff" stroke="#7C3AED" stroke-width="3"/><circle cx="870" cy="270" r="28" fill="#7C3AED"/><text x="870" y="279" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="850" fill="#fff" text-anchor="middle">S</text><text x="870" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="850" fill="#7C3AED" text-anchor="middle">sensor</text><text x="870" y="350" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#5B6780" text-anchor="middle">眼睛/耳朵</text>
<rect x="990" y="225" width="140" height="145" rx="18" fill="#fff" stroke="#2563EB" stroke-width="3"/><circle cx="1060" cy="270" r="28" fill="#2563EB"/><text x="1060" y="279" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="850" fill="#fff" text-anchor="middle">B</text><text x="1060" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="850" fill="#2563EB" text-anchor="middle">base</text><text x="1060" y="350" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#5B6780" text-anchor="middle">车身</text>
<rect x="1180" y="225" width="140" height="145" rx="18" fill="#fff" stroke="#F97316" stroke-width="3"/><circle cx="1250" cy="270" r="28" fill="#F97316"/><text x="1250" y="279" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="850" fill="#fff" text-anchor="middle">O</text><text x="1250" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="850" fill="#F97316" text-anchor="middle">odom</text><text x="1250" y="350" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#5B6780" text-anchor="middle">局部记事本</text>
<rect x="1370" y="225" width="140" height="145" rx="18" fill="#fff" stroke="#16A34A" stroke-width="3"/><circle cx="1440" cy="270" r="28" fill="#16A34A"/><text x="1440" y="279" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="850" fill="#fff" text-anchor="middle">M</text><text x="1440" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="850" fill="#16A34A" text-anchor="middle">map</text><text x="1440" y="350" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#5B6780" text-anchor="middle">全局地图</text>
<line x1="945" y1="298" x2="985" y2="298" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow-blue)"/><line x1="1135" y1="298" x2="1175" y2="298" stroke="#F97316" stroke-width="5" marker-end="url(#arrow-orange)"/><line x1="1325" y1="298" x2="1365" y2="298" stroke="#16A34A" stroke-width="5" marker-end="url(#arrow-green)"/><text x="1170" y="435" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="800" fill="#172033" text-anchor="middle">点坐标路径：sensor → base → odom → map</text>
</svg>
