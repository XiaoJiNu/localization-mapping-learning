<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="RFU与FLU以及点和方向向量">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#F97316"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16A34A"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="560" fill="#F7F9FC"/>
<text x="40" y="48" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="32" font-weight="800" fill="#172033">先统一坐标约定，再区分点和方向向量</text>
<text x="40" y="82" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#5B6780">切换坐标系不是改名字；点依赖原点，方向向量不依赖共同平移</text>
<line x1="40" y1="100" x2="1560" y2="100" stroke="#D8E1EF" stroke-width="2"/>
<rect x="35" y="125" width="720" height="390" rx="18" fill="#FFFFFF" stroke="#D8E1EF" filter="url(#shadow)"/>
<circle cx="75" cy="161" r="22" fill="#2563EB"/><text x="75" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="109" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">RFU 与 ROS 常见 FLU</text>
<line x1="170" y1="390" x2="296" y2="390" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-orange)"/><line x1="170" y1="390" x2="170" y2="274" stroke="#16A34A" stroke-width="4" marker-end="url(#arrow-green)"/><circle cx="170" cy="390" r="7" fill="#172033"/>
<text x="302" y="398" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#DC2626">x_RFU</text><text x="160" y="267" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">y_RFU</text><text x="154" y="416" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="end">O_RFU</text>
<text x="170" y="220" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172033" text-anchor="middle">RFU</text><text x="100" y="465" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#DC2626">x：右</text><text x="100" y="495" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#16A34A">y：前</text><text x="100" y="525" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#2563EB">z：上</text>
<line x1="500" y1="390" x2="626" y2="390" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-orange)"/><line x1="500" y1="390" x2="500" y2="274" stroke="#16A34A" stroke-width="4" marker-end="url(#arrow-green)"/><circle cx="500" cy="390" r="7" fill="#172033"/>
<text x="632" y="398" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#DC2626">x_FLU</text><text x="490" y="267" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">y_FLU</text><text x="484" y="416" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="end">O_FLU</text>
<text x="500" y="220" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172033" text-anchor="middle">FLU</text><text x="430" y="465" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#16A34A">x：前</text><text x="430" y="495" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#DC2626">y：左</text><text x="430" y="525" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#2563EB">z：上</text>
<rect x="620" y="225" width="105" height="210" rx="14" fill="#FEF9C3" stroke="#EAB308"/><text x="673" y="260" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#172033" text-anchor="middle">提醒</text><text x="673" y="300" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650" fill="#172033" text-anchor="middle"><tspan x="673">轴名相同</tspan><tspan x="673" dy="32">不代表</tspan><tspan x="673" dy="32">物理方向相同</tspan></text>
<rect x="785" y="125" width="780" height="390" rx="18" fill="#FFFFFF" stroke="#D8E1EF" filter="url(#shadow)"/>
<circle cx="825" cy="161" r="22" fill="#7C3AED"/><text x="825" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="859" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">点 vs 方向向量</text>
<rect x="820" y="205" width="335" height="250" rx="16" fill="#DBEAFE"/><text x="988" y="240" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="800" fill="#2563EB" text-anchor="middle">点：依赖原点</text>
<line x1="865" y1="410" x2="951" y2="410" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow-blue)"/><line x1="865" y1="410" x2="865" y2="331" stroke="#16A34A" stroke-width="4" marker-end="url(#arrow-green)"/><circle cx="865" cy="410" r="7" fill="#172033"/><text x="955" y="418" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#2563EB">x_A</text><text x="855" y="326" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">y_A</text><text x="849" y="436" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="end">O_A</text>
<line x1="1055" y1="410" x2="1141" y2="410" stroke="#F97316" stroke-width="4" marker-end="url(#arrow-orange)"/><line x1="1055" y1="410" x2="1055" y2="331" stroke="#16A34A" stroke-width="4" marker-end="url(#arrow-green)"/><circle cx="1055" cy="410" r="7" fill="#172033"/><text x="1145" y="418" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#F97316">x_B</text><text x="1045" y="326" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">y_B</text><text x="1039" y="436" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="end">O_B</text>
<circle cx="1010" cy="270" r="10" fill="#7C3AED"/><text x="1030" y="266" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#7C3AED">P</text><line x1="865" y1="410" x2="1010" y2="270" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7 6"/><line x1="1055" y1="410" x2="1010" y2="270" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7 6"/><text x="988" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="750" fill="#DC2626" text-anchor="middle">平移会改变点的坐标</text>
<rect x="1190" y="205" width="335" height="250" rx="16" fill="#EDE9FE"/><text x="1358" y="240" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="800" fill="#7C3AED" text-anchor="middle">方向：只看差值</text><circle cx="1250" cy="390" r="8" fill="#172033"/><circle cx="1435" cy="285" r="8" fill="#172033"/><line x1="1250" y1="390" x2="1435" y2="285" stroke="#7C3AED" stroke-width="5" marker-end="url(#arrow-purple)"/><line x1="1290" y1="435" x2="1475" y2="330" stroke="#16A34A" stroke-width="5" marker-end="url(#arrow-green)"/><circle cx="1290" cy="435" r="8" fill="#172033"/><circle cx="1475" cy="330" r="8" fill="#172033"/><text x="1358" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="750" fill="#16A34A" text-anchor="middle">两个端点一起平移，箭头不变</text>
</svg>
