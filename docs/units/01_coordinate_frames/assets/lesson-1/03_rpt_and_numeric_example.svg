<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="570" viewBox="0 0 1600 570" role="img" aria-label="R乘p加t与二维例子">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/></filter><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#F97316"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16A34A"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker></defs>
<rect width="1600" height="570" fill="#F7F9FC"/><text x="40" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="800" fill="#172033">为什么一定是 R·p + t</text><text x="40" y="82" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#5B6780">先统一方向，再补原点差；几何箭头比死记公式更可靠</text><line x1="40" y1="100" x2="1560" y2="100" stroke="#D8E1EF" stroke-width="2"/>
<rect x="35" y="125" width="735" height="410" rx="18" fill="#fff" stroke="#D8E1EF" filter="url(#shadow)"/><circle cx="75" cy="161" r="22" fill="#16A34A"/><text x="75" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="109" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">三段箭头组成一条路径</text>
<circle cx="110" cy="430" r="10" fill="#2563EB"/><text x="95" y="465" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#2563EB" text-anchor="end">O_A</text><circle cx="410" cy="280" r="10" fill="#F97316"/><text x="410" y="262" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#F97316" text-anchor="middle">O_B</text><circle cx="660" cy="225" r="11" fill="#7C3AED"/><text x="678" y="229" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#7C3AED">P</text>
<line x1="110" y1="430" x2="410" y2="280" stroke="#16A34A" stroke-width="6" marker-end="url(#arrow-green)"/><line x1="410" y1="280" x2="660" y2="225" stroke="#F97316" stroke-width="6" marker-end="url(#arrow-orange)"/><line x1="110" y1="430" x2="660" y2="225" stroke="#2563EB" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
<text x="250" y="330" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="800" fill="#16A34A" text-anchor="middle">t_AB：原点差</text><text x="535" y="235" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#F97316" text-anchor="middle">R_AB · p_B：统一方向</text><text x="380" y="470" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#2563EB" text-anchor="middle">p_A：最终读数</text><rect x="150" y="485" width="510" height="54" rx="12" fill="#DCFCE7" stroke="#16A34A"/><text x="405" y="521" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#172033" text-anchor="middle">p_A = R_AB · p_B + t_AB</text>
<rect x="800" y="125" width="765" height="410" rx="18" fill="#fff" stroke="#D8E1EF" filter="url(#shadow)"/><circle cx="840" cy="161" r="22" fill="#F97316"/><text x="840" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="874" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="750" fill="#172033">90° 可手算例子</text>
<rect x="830" y="190" width="145" height="245" rx="14" fill="#EEF2F7"/><text x="902" y="230" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="650" fill="#172033" text-anchor="middle"><tspan x="902">R_AB =</tspan><tspan x="902" dy="33">[ 0  -1 ]</tspan><tspan x="902" dy="33">[ 1   0 ]</tspan><tspan x="902" dy="66">p_B = [2,1]</tspan></text>
