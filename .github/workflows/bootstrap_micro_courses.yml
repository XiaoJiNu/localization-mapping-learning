name: Materialize 20-hour micro-course

on:
  push:
    branches:
      - feat/20h-micro-lessons
    paths:
      - "scripts/bootstrap_micro_courses.py"
      - "scripts/.micro_course_payload/**"
      - ".github/workflows/bootstrap_micro_courses.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the new branch
        uses: actions/checkout@v4
        with:
          ref: feat/20h-micro-lessons
          fetch-depth: 0

      - name: Decode and validate all course files
        run: python scripts/bootstrap_micro_courses.py

      - name: Remove one-shot bootstrap files
        run: |
          rm -rf scripts/.micro_course_payload
          rm -f scripts/bootstrap_micro_courses.py
          rm -f .github/workflows/bootstrap_micro_courses.yml

      - name: Commit the completed 20-hour course
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: split 20-hour curriculum into 100 micro-lessons"
          git push origin HEAD:feat/20h-micro-lessons
