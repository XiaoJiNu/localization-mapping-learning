name: 错误与调试
description: 记录可复现的代码错误或定位建图异常
title: "[Debug] "
labels: ["debug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 实际发生了什么？请包含必要的数值或日志摘要。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 命令、输入、版本和稳定复现步骤。
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 初步类别
      options:
        - 概念或模型
        - 坐标系或变换方向
        - 时间同步或运动补偿
        - 单位或数值稳定性
        - 数据或环境
        - 尚不清楚
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容确认
      options:
        - label: 我确认内容中不含公司、项目或个人敏感信息
          required: true
