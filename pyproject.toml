[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localization-mapping-learning"
version = "0.1.0"
description = "Reproducible exercises for learning localization, mapping, and state estimation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "localization-mapping-learning contributors"},
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.0",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"experiments/**/run.py" = ["E402"]
